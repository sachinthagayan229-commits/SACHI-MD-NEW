name: SACHI-MD PAIR & RUN

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select Action'
        required: true
        default: 'pair'
        type: choice
        options:
          - pair
          - run
      number:
        description: 'Number 947XXXXXXXX'
        required: false
        type: string

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install

      - name: Get Pair Code
        if: ${{ inputs.action == 'pair' }}
        run: |
          echo "Number: ${{ inputs.number }}"
          ls -la
          if [ -f pair.js ]; then
            node pair.js ${{ inputs.number }}
          elif [ -f pairing.js ]; then
            node pairing.js ${{ inputs.number }}
          elif [ -f src/pair.js ]; then
            node src/pair.js ${{ inputs.number }}
          else
            echo "Trying npm way..."
            npm start &
            sleep 10
            cat *.log || true
          fi

      - name: Run Bot
        if: ${{ inputs.action == 'run' }}
        run: npm start
