name: SACHI-MD V2 Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Restore Session
        uses: actions/cache@v4
        with:
          path: ./session
          key: sachi-session-${{ hashFiles('**/package-lock.json') }}-${{ secrets.SESSION_ID }}
          restore-keys: |
            sachi-session-

      - name: Run Bot
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}
        run: npm start
