name: SACHI-MD PAIR & RUN

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select Action'
        required: true
        default: 'pair'
        type: choice
        options:
          - pair
          - run
      number:
        description: 'Number 947XXXXXXXX'
        required: false
        type: string

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install

      - name: Fix Pair.js ES Module
        if: ${{ inputs.action == 'pair' }}
        run: |
          cat > pair.js << 'EOF'
          import makeWASocket, { useMultiFileAuthState, delay } from "@whiskeysockets/baileys";
          import pino from "pino";
          const number = process.argv[2];
          if (!number) { console.log("❌ Number missing!"); process.exit(1); }
          console.log(`Pairing for: ${number}`);
          const { state, saveCreds } = await useMultiFileAuthState("./session");
          const sock = makeWASocket.default({
            logger: pino({ level: "silent" }),
            auth: state,
            printQRInTerminal: false,
            browser: ["SACHI-MD", "Chrome", "1.0"]
          });
          if (!sock.authState.creds.registered) {
            await delay(2000);
            const code = await sock.requestPairingCode(number.replace(/[^0-9]/g, ""));
            console.log("\n=================================");
            console.log(`✅ PAIR CODE: ${code}`);
            console.log("=================================\n");
          }
          sock.ev.on("creds.update", saveCreds);
          await delay(120000);
          EOF

      - name: Get Pair Code
        if: ${{ inputs.action == 'pair' }}
        run: node pair.js ${{ inputs.number }}

      - name: Run Bot
        if: ${{ inputs.action == 'run' }}
        run: npm start
