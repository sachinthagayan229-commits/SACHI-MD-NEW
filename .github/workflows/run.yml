name: SACHI-MD 5H AUTO RESTART

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 290

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Setup Session File
        run: |
          mkdir -p auth_info_baileys
          mkdir -p session
          node -e "
          import fs from 'fs';
          const sid = 'SACHI-MD~';
          const b64 = sid.split('~')[1];
          const json = Buffer.from(b64, 'base64').toString();
          fs.writeFileSync('./auth_info_baileys/creds.json', json);
          fs.writeFileSync('./session/creds.json', json);
          console.log('Session file created ✅');
          "
      - name: Run SACHI-MD
        run: node index.js
