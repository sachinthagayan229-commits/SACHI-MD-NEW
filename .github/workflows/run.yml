
name: SACHI-MD 5H AUTO RESTART

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: sachi-md-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 290

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Restore Session
        uses: actions/cache/restore@v4
        with:
          path: session
          key: sachi-session-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sachi-session-

      - name: Run Bot
        run: |
          set +e
          timeout 280m npm start
          code=$?
          if [ "$code" -eq 124 ]; then
            echo "Scheduled restart"
            exit 0
          fi
          exit "$code"

      - name: Save Session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: session
          key: sachi-session-${{ github.run_id }}-${{ github.run_attempt }}
