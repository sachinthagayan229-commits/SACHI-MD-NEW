name: GET PAIR CODE

on:
  workflow_dispatch:
    inputs:
      number:
        description: 'WhatsApp Number (94778936490)'
        required: true
        type: string

jobs:
  pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      
      - name: Get Pair Code
        run: node pair.js ${{ inputs.number }}
